name: Tests

# Stdlib unittest suite for the evaluation scripts. Runs on pull requests
# and on pushes to main.
on:
  pull_request:
  push:
    branches: [main]

# Least-privilege: the job only reads the repo.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    # The suite patches every Hub call; this makes any unpatched call fail
    # fast in CI instead of reaching the network.
    env:
      HF_HUB_OFFLINE: "1"
    steps:
      # Actions are pinned to full commit SHAs, not mutable tags.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The scripts import huggingface_hub at module level. The tests
      # themselves make no network calls.
      - name: Install dependencies
        run: python -m pip install huggingface_hub

      - name: Run unit tests
        run: python -m unittest discover -s expedition-tiny-aya/evaluation/scripts -p 'test_*.py' -v
